# Render Blueprint — API contínua do Orbe (Express + Prisma + cron/WS)
# https://render.com/docs/blueprint-spec
#
# Recomendado: runtime node + rootDir api (abaixo) — sem Docker, OpenSSL do Render.
# Docker (raiz ou api/): use node:20-slim + openssl (não Alpine) — ver Dockerfiles.
services:
  - type: web
    name: orbe-api
    runtime: node
    rootDir: api
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SYNC_SECRET
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Webhooks IGDB (opcionais — deixe em branco/false pra manter desativados)
      - key: PUBLIC_API_URL
        sync: false
      - key: IGDB_WEBHOOKS_ENABLED
        value: "false"
      - key: IGDB_WEBHOOK_SECRET
        sync: false
      - key: ORBE_ADMIN_EMAILS
        sync: false
      - key: GITHUB_ACTIONS_READ_TOKEN
        sync: false
      # --- Egress Render free (~5 GB/mês) — ver docs/RENDER-RECUPERAR-BANDA.md ---
      - key: ORBE_EGRESS_SAVER
        value: "true"
      - key: SYNC_SKIP_DETETIVE_PHASE
        value: "true"
      - key: DISABLE_DETETIVE_CRON
        value: "true"
      - key: DISABLE_BACKFILL_STEP
        value: "true"
      - key: DEALS_CRON_SCHEDULE
        value: "*/15 * * * *"

  # Front Next.js — alternativa quando Vercel Hobby estoura banda (mesma conta Render).
  - type: web
    name: orbe-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: API_PROXY_ORIGIN
        fromService:
          type: web
          name: orbe-api
          property: host
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: orbe-api
          property: host
        # Render injeta host; o Next precisa de /api — ajuste no dashboard se necessário:
        # NEXT_PUBLIC_API_URL=https://<orbe-api-host>/api
