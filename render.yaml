# Render Blueprint — API contínua do Orbe (Express + Prisma + cron/WS)
# https://render.com/docs/blueprint-spec
#
# Recomendado: runtime node + rootDir api (abaixo) — sem Docker, OpenSSL do Render.
# Docker (raiz ou api/): use node:20-slim + openssl (não Alpine) — ver Dockerfiles.
services:
  - type: web
    name: orbe-api
    runtime: node
    rootDir: api
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    # Migrate manual no Shell com DIRECT_URL — evita P3009 no boot
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SYNC_SECRET
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Webhooks IGDB (opcionais — deixe em branco/false pra manter desativados)
      - key: PUBLIC_API_URL
        sync: false
      - key: IGDB_WEBHOOKS_ENABLED
        value: "false"
      - key: IGDB_WEBHOOK_SECRET
        sync: false
