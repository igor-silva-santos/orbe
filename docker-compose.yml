services:
  postgres:
    image: postgres:15-alpine
    container_name: orbe-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin2011
      POSTGRES_DB: orbe_nerd_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: orbe-redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: orbe-api
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: "development"
      DATABASE_URL: "postgresql://postgres:admin2011@postgres:5432/orbe_nerd_db"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "dev_orbe_jwt_altere_antes_de_expor_na_rede"
      SYNC_SECRET: "dev_orbe_sync_altere_antes_de_expor_na_rede"
      CORS_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
      ALLOW_INSECURE_DEV_SECRETS: "true"
      PORT: 3001
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orbe-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001/api"
    depends_on:
      - api

volumes:
  postgres_data:
