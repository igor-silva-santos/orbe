# Orbe — GitLab é a fonte de verdade para produção.
# Push na master do GitLab → testes + deploy (hooks). GitHub não deve disparar Vercel/Render.
#
# Ops (sync guard): schedule / pipeline manual (web) com ORBE_OPS_ACTION.
# Ping longo: Cloudflare Worker ops/render_sync_watch_worker.js
#
# Variáveis CI/CD (Settings → CI/CD → Variables, masked):
#   RENDER_DEPLOY_HOOK  — Render → Service → Settings → Deploy Hook
#   VERCEL_DEPLOY_HOOK  — Vercel → Project → Settings → Git → Deploy Hooks (branch master)

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - test
  - deploy
  - operations

variables:
  NODE_VERSION: "20"
  # Até configurar RENDER_DEPLOY_HOOK + VERCEL_DEPLOY_HOOK no GitLab, não falha o pipeline
  # (deploy nativo: Vercel/Render conectados só ao repo GitLab).
  ORBE_NATIVE_GITLAB_DEPLOY: "true"

.test_api:
  image: node:${NODE_VERSION}-bookworm-slim
  before_script:
    - cd api && npm ci && npx prisma generate
  script:
    - npm test

test:api:
  stage: test
  extends: .test_api
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

deploy:production:
  stage: deploy
  image: curlimages/curl:8.12.1
  needs:
    - test:api
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
  environment:
    name: production
    url: https://orbe-seven.vercel.app
  script:
    - |
      set -e
      if [ "${ORBE_NATIVE_GITLAB_DEPLOY:-}" = "true" ]; then
        echo "ORBE_NATIVE_GITLAB_DEPLOY=true — Vercel/Render devem estar conectados só ao GitLab (sem hooks)."
        exit 0
      fi
      missing=0
      if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
        echo "⚠️  RENDER_DEPLOY_HOOK não definido — configure em GitLab CI/CD ou use Render conectado só ao GitLab."
        missing=1
      else
        echo "▶ Disparando deploy da API (Render)..."
        curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
        echo "OK Render"
      fi
      if [ -z "${VERCEL_DEPLOY_HOOK:-}" ]; then
        echo "⚠️  VERCEL_DEPLOY_HOOK não definido — configure em GitLab CI/CD ou use Vercel conectado só ao GitLab."
        missing=1
      else
        echo "▶ Disparando deploy do frontend (Vercel)..."
        curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
        echo "OK Vercel"
      fi
      if [ "$missing" -eq 1 ]; then
        echo ""
        echo "Nenhum hook configurado: produção só sobe se Vercel/Render estiverem ligados ao repo GitLab (não ao GitHub)."
        echo "Veja docs/DEPLOY_GITLAB.md"
        exit 1
      fi

# Sync / keep-alive: use GitLab (não GitHub Actions). Pipeline manual → variável ORBE_OPS_ACTION.
# resume | watch | status | health — exige SYNC_SECRET em CI/CD (masked).
orbe-sync-guard:
  stage: operations
  image: python:3.12-alpine
  timeout: 55 minutes
  variables:
    ORBE_API_URL: "https://orbe-7bu0.onrender.com"
    ORBE_OPS_ACTION: "status"
  script:
    - python ops/orbe_sync_guard.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $ORBE_OPS_ACTION == "health"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $ORBE_OPS_ACTION == "status"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $ORBE_OPS_ACTION == "resume"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $ORBE_OPS_ACTION == "watch"'
