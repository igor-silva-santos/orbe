# Pipeline exclusivamente operacional: não compila nem implanta o clone antigo.
#
# Schedule recomendado para retomada:
#   cron: 0 */2 * * *
#   variável: ORBE_OPS_ACTION=resume
#
# O keepalive deve ser um monitor HTTP gratuito separado apontando somente para
# GET https://orbe-7bu0.onrender.com/api/health a cada 5–10 minutos. Não coloque
# SYNC_SECRET no monitor externo nem na URL.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - operations

orbe-sync-guard:
  stage: operations
  image: python:3.12-alpine
  timeout: 5 minutes
  variables:
    ORBE_API_URL: "https://orbe-7bu0.onrender.com"
    ORBE_OPS_ACTION: "status"
  script:
    - python ops/orbe_sync_guard.py
  rules:
    - if: '$ORBE_OPS_ACTION == "health"'
    - if: '$ORBE_OPS_ACTION == "status"'
    - if: '$ORBE_OPS_ACTION == "resume"'
    - when: never
