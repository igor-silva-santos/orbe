# Orbe — GitLab é a fonte de verdade para produção.
# Push na master do GitLab → testes + deploy (hooks). GitHub não deve disparar Vercel/Render.
#
# Ops (sync guard): schedule / pipeline manual (web) com ORBE_OPS_ACTION.
# Ping longo: Cloudflare Worker ops/render_sync_watch_worker.js
#
# Variáveis CI/CD (Settings → CI/CD → Variables, masked):
#   RENDER_DEPLOY_HOOK  — Render → Service → Settings → Deploy Hook
#   VERCEL_DEPLOY_HOOK  — Vercel → Project → Settings → Git → Deploy Hooks (branch master)

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - test
  - deploy
  - operations

# Espelho GitHub (igor-silva-santos/orbe): defina GITHUB_MIRROR_TOKEN no GitLab CI/CD (PAT com escrita no repo).

variables:
  NODE_VERSION: "20"
  # Até configurar RENDER_DEPLOY_HOOK + VERCEL_DEPLOY_HOOK no GitLab, não falha o pipeline
  # (deploy nativo: Vercel/Render conectados só ao repo GitLab).
  ORBE_NATIVE_GITLAB_DEPLOY: "true"

.test_api:
  image: node:${NODE_VERSION}-bookworm-slim
  before_script:
    # Prisma precisa de openssl no sistema; sem isso o generate cai em libssl 1.1 e os testes falham no CI.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl ca-certificates
    - cd api && npm ci && npx prisma generate
  script:
    - npm test

test:api:
  stage: test
  extends: .test_api
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Run pipeline (web) na branch — exige test:api para mirror:github (needs)
    - if: '$CI_PIPELINE_SOURCE == "web"'

.mirror_github:
  image: node:${NODE_VERSION}-bookworm-slim
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
  script:
    - |
      set -e
      if [ -z "${GITHUB_MIRROR_TOKEN:-}" ]; then
        echo "ERRO: GITHUB_MIRROR_TOKEN não está disponível neste job."
        echo "GitLab → Variables: sem Protect variable"
        exit 1
      fi
      GITHUB_REPO="https://github.com/igor-silva-santos/orbe.git"
      AUTH_HEADER="AUTHORIZATION: bearer ${GITHUB_MIRROR_TOKEN}"
      BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-${CI_COMMIT_REF_NAME}}"
      echo "branch=${BRANCH} sha=$(git rev-parse HEAD)"
      git config user.email "gitlab-ci@orbenerd.local"
      git config user.name "GitLab Mirror"
      git fetch --unshallow 2>/dev/null || true
      echo "Testando PAT na API (repos/orbe)..."
      HTTP_CODE="$(curl -sS -o /tmp/gh-repo.json -w '%{http_code}' \
        -H "${AUTH_HEADER}" -H "Accept: application/vnd.github+json" \
        "https://api.github.com/repos/igor-silva-santos/orbe")"
      echo "API HTTP ${HTTP_CODE}"
      if [ "${HTTP_CODE}" != "200" ]; then
        head -c 400 /tmp/gh-repo.json || true
        echo ""
        echo "PAT sem acesso ao repo. Use fine-grained: repo orbe + Contents Read/Write + Metadata Read."
        exit 1
      fi
      REMOTE_HEAD="$(git -c "http.extraHeader=${AUTH_HEADER}" ls-remote "${GITHUB_REPO}" "refs/heads/${BRANCH}" 2>/dev/null | awk 'NR==1{print $1}')"
      PUSH_OPTS=""
      if [ -n "${REMOTE_HEAD}" ]; then
        echo "Branch já existe no GitHub; force-with-lease"
        PUSH_OPTS="--force-with-lease"
      else
        echo "Criando branch nova no GitHub"
      fi
      if ! git -c "http.extraHeader=${AUTH_HEADER}" push ${PUSH_OPTS} "${GITHUB_REPO}" "HEAD:refs/heads/${BRANCH}" 2> /tmp/push.log; then
        echo "--- git push (erro) ---"
        cat /tmp/push.log
        if grep -qi workflow /tmp/push.log; then
          echo ""
          echo "Este repo tem .github/workflows — no PAT fine-grained marque também:"
          echo "  • Repository permissions → Workflows → Read and write"
          echo "Ou use Classic PAT com escopo repo (full)."
        fi
        exit 1
      fi
      echo "OK: https://github.com/igor-silva-santos/orbe/tree/${BRANCH}"

mirror:github:
  stage: deploy
  extends: .mirror_github
  needs:
    - job: test:api
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Se test:api falhar mas você só quiser espelhar: Run pipeline → job manual
mirror:github:manual:
  stage: deploy
  extends: .mirror_github
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

deploy:production:
  stage: deploy
  image: curlimages/curl:8.12.1
  needs:
    - test:api
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
  environment:
    name: production
    url: https://orbe-seven.vercel.app
  script:
    - |
      set -e
      if [ "${ORBE_NATIVE_GITLAB_DEPLOY:-}" = "true" ]; then
        echo "ORBE_NATIVE_GITLAB_DEPLOY=true — Vercel/Render devem estar conectados só ao GitLab (sem hooks)."
        exit 0
      fi
      missing=0
      if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
        echo "⚠️  RENDER_DEPLOY_HOOK não definido — configure em GitLab CI/CD ou use Render conectado só ao GitLab."
        missing=1
      else
        echo "▶ Disparando deploy da API (Render)..."
        curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
        echo "OK Render"
      fi
      if [ -z "${VERCEL_DEPLOY_HOOK:-}" ]; then
        echo "⚠️  VERCEL_DEPLOY_HOOK não definido — configure em GitLab CI/CD ou use Vercel conectado só ao GitLab."
        missing=1
      else
        echo "▶ Disparando deploy do frontend (Vercel)..."
        curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
        echo "OK Vercel"
      fi
      if [ "$missing" -eq 1 ]; then
        echo ""
        echo "Nenhum hook configurado: produção só sobe se Vercel/Render estiverem ligados ao repo GitLab (não ao GitHub)."
        echo "Veja docs/DEPLOY_GITLAB.md"
        exit 1
      fi

# Sync / keep-alive: use GitLab (não GitHub Actions). Pipeline manual → variável ORBE_OPS_ACTION.
# resume | watch | status | health — exige SYNC_SECRET em CI/CD (masked).
orbe-sync-guard:
  stage: operations
  image: python:3.12-alpine
  timeout: 55 minutes
  variables:
    ORBE_API_URL: "https://orbe-7bu0.onrender.com"
    ORBE_OPS_ACTION: "status"
  script:
    - python ops/orbe_sync_guard.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $ORBE_OPS_ACTION == "health"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $ORBE_OPS_ACTION == "status"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $ORBE_OPS_ACTION == "resume"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $ORBE_OPS_ACTION == "watch"'
