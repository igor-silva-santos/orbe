<!doctype html>

<html lang="pt-BR">

<head>

  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Orbe Sync</title>

  <style>

    body { font-family: system-ui, sans-serif; width: 320px; margin: 0; padding: 16px; color: #1a1a1a; }

    h1 { font-size: 16px; margin: 0 0 12px; color: #ff5000; }

    label { display: block; font-size: 12px; margin-bottom: 10px; }

    input, textarea { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px; border: 1px solid #eee; border-radius: 8px; }

    button { width: 100%; margin-top: 8px; padding: 10px; border: 0; border-radius: 8px; background: #ff5000; color: #fff; font-weight: 700; cursor: pointer; }

    button:disabled { opacity: .6; cursor: not-allowed; }

    #status { margin-top: 12px; font-size: 12px; color: #666; min-height: 20px; white-space: pre-wrap; }

    .hint { font-size: 11px; color: #888; margin-top: 8px; }

    .progress-wrap { display: none; margin-top: 12px; }

    .progress-wrap.active { display: block; }

    .progress-label { font-size: 12px; color: #666; margin-bottom: 6px; }

    .progress-bar { width: 100%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }

    .progress-fill { height: 100%; width: 0%; background: #ff5000; border-radius: 4px; transition: width .2s ease; }

    .failed-wrap { display: none; margin-top: 12px; }

    .failed-wrap.active { display: block; }

    .failed-title { font-size: 12px; font-weight: 700; color: #b91c1c; margin-bottom: 6px; }

    .failed-list { max-height: 120px; overflow-y: auto; font-size: 11px; color: #666; padding-left: 16px; margin: 0; }

    .failed-list li { margin-bottom: 4px; }

    .connected { color: #15803d; font-size: 11px; margin-top: 4px; }
    .replace-hint { display: block; font-size: 11px; color: #666; margin-top: 10px; line-height: 1.4; }
    .replace-hint input { width: auto; margin-right: 6px; vertical-align: middle; }

  </style>

</head>

<body>

  <h1>Orbe ┬À Crunchyroll</h1>

  <label>URL da API

    <input id="apiUrl" type="url" value="http://localhost:5000/api" />

  </label>

  <label>Token JWT do Orbe

    <textarea id="token" rows="3" placeholder="Conecte em /extensao no Orbe ou cole o token"></textarea>

    <span id="authStatus" class="connected" hidden>Conectado via Orbe</span>

  </label>

  <button id="saveBtn" type="button">Salvar configura├º├Áes</button>

  <label class="replace-hint">
    <input id="confirmReplace" type="checkbox" />
    Entendo que animes da Crunchyroll fora da fila sincronizada ser├úo removidos do Orbe (somente se a sync for 100% bem-sucedida).
  </label>

  <button id="syncBtn" type="button">Sincronizar fila agora</button>



  <div id="progressWrap" class="progress-wrap">

    <div id="progressLabel" class="progress-label">Sincronizando...</div>

    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>

  </div>



  <div id="failedWrap" class="failed-wrap">

    <div class="failed-title">Itens com falha</div>

    <ul id="failedList" class="failed-list"></ul>

  </div>



  <p class="hint">Abra crunchyroll.com/watchlist ou /queue antes de sincronizar.</p>
  <p class="hint"><a id="docsLink" href="http://localhost:3000/extensao/crunchyroll" target="_blank">Como funciona e c├│digo aberto</a></p>
  <p class="hint">Autentique em <strong>orbenerd.com/extensao</strong> (ou localhost:3000/extensao).</p>

  <p class="hint"><a href="../options/options.html" target="_blank">Configura├º├Áes avan├ºadas</a></p>

  <div id="status"></div>

  <script src="popup.js"></script>

</body>

</html>
