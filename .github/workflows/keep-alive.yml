name: Keep API Acordada (Render free tier)

# O plano free do Render hiberna o serviço após ~15min sem tráfego HTTP de
# entrada — e isso mata TODOS os crons internos do Node (deals a cada 10min,
# Detetive Digital 3h, refresh de preços Steam 4h, renovação de webhooks
# IGDB 5h — ver api/src/index.ts), já que o processo inteiro fica suspenso.
#
# Este workflow só faz um GET em /api/health o tempo todo (24h/dia), pra
# garantir que o serviço nunca hiberne e os crons internos disparem nos
# horários certos. Sem side effects — não inicia nem interfere em sync
# nenhum, só mantém o processo vivo.

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/health
        env:
          API_URL: ${{ secrets.ORBE_API_URL }}
        run: |
          API_BASE="${API_URL:-https://orbe-7bu0.onrender.com}"
          curl -sf "${API_BASE}/api/health" >/dev/null && echo "OK: ${API_BASE}/api/health respondeu." || echo "::warning::${API_BASE}/api/health não respondeu (cold start em andamento?)."
