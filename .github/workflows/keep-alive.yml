name: Keep API Acordada (Render free tier)

# O plano free do Render hiberna o serviço após ~15min sem tráfego HTTP de
# entrada — e isso mata TODOS os crons internos do Node (deals a cada 10min,
# Detetive Digital 3h, refresh de preços Steam 4h, renovação de webhooks
# IGDB 5h — ver api/src/index.ts), já que o processo inteiro fica suspenso.
#
# GET em /api/health a cada ~12 min **somente se** ORBE_KEEP_ALIVE_ENABLED=true (repo variable)
# ou disparo manual. Evita egress 24/7 no Render free; durante sync longo, sync-all.yml
# e sync-catalog-range.yml fazem ping próprio.

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || vars.ORBE_KEEP_ALIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GET /api/health
        env:
          ORBE_API_URL: ${{ secrets.ORBE_API_URL }}
        run: |
          source .github/scripts/orbe-render-api.sh
          set +e
          orbe_wait_health
          code=$?
          set -e
          if [ "$code" = "78" ]; then
            echo "Render suspenso — keep-alive não adianta até Resume + reset de banda."
            exit 0
          fi
          if [ "$code" != "0" ]; then exit "$code"; fi
          echo "OK: $(orbe_api_base)/api/health"
