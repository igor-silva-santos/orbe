name: Sync Diário (catálogo do ano corrente)

# Roda toda madrugada sem precisar de clique manual: se há um checkpoint pra
# retomar (sync anterior interrompido/incompleto), retoma; senão, dispara um
# sync completo do ano corrente (filmes → detetive → séries → animes → jogos
# → undated → prêmios) pra pegar lançamentos novos. Idempotente — se já tem
# um sync ativo e saudável, não faz nada (evita duplicar trabalho).
#
# Mesma lógica de decisão do run-sync-backfill-step, aplicada ao sync
# "atual" em vez do backfill histórico. Não mantém keep-alive próprio: o
# workflow separado "Keep API Acordada" já garante que o Render não hiberna
# enquanto o sync roda em background (pode levar horas).
#
# Configuração necessária (Settings → Secrets and variables → Actions):
#   ORBE_API_URL  — ex.: https://orbe-7bu0.onrender.com (sem barra no final)
#   SYNC_SECRET   — mesmo valor da env SYNC_SECRET configurada no Render

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar API no Render (cold start)
        env:
          API_URL: ${{ secrets.ORBE_API_URL }}
        run: |
          API_BASE="${API_URL:-https://orbe-7bu0.onrender.com}"
          echo "Aguardando API em ${API_BASE}/api/health ..."
          for i in $(seq 1 12); do
            if curl -sf "${API_BASE}/api/health" >/dev/null; then
              echo "API online."
              exit 0
            fi
            echo "Tentativa ${i}/12 — aguardando 10s..."
            sleep 10
          done
          echo "::error::API não respondeu em 2 minutos."
          exit 1

      - name: Decidir e disparar (retomar checkpoint ou iniciar sync do ano corrente)
        env:
          API_URL: ${{ secrets.ORBE_API_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          API_BASE="${API_URL:-https://orbe-7bu0.onrender.com}"
          if [ -z "$SYNC_SECRET" ]; then
            echo "::error::Configure SYNC_SECRET e ORBE_API_URL em Settings → Secrets → Actions"
            exit 1
          fi

          STATUS=$(curl -sf "${API_BASE}/api/sync/status" || echo '{}')
          echo "Status atual:"
          echo "$STATUS" | python3 -m json.tool 2>/dev/null || echo "$STATUS"

          ACTIVE=$(echo "$STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('syncActive', False))" 2>/dev/null || echo False)
          STALE=$(echo "$STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('stale', False))" 2>/dev/null || echo False)
          RESUME_AVAIL=$(echo "$STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('resumeAvailable', False))" 2>/dev/null || echo False)
          INTERRUPTED=$(echo "$STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('interrupted', False))" 2>/dev/null || echo False)

          if [ "$ACTIVE" = "True" ] && [ "$STALE" != "True" ]; then
            echo "▶ Sync já em andamento (e saudável) — nada a fazer hoje."
            exit 0
          fi

          if [ "$RESUME_AVAIL" = "True" ] || [ "$INTERRUPTED" = "True" ]; then
            echo "▶ Checkpoint pendente — retomando (run-sync-resume)..."
            RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${API_BASE}/api/run-sync-resume" \
              -H "x-sync-secret: ${SYNC_SECRET}" \
              -H "Content-Type: application/json")
          else
            YEAR=$(date -u +%Y)
            echo "▶ Sem checkpoint pendente — iniciando sync completo do ano ${YEAR} (run-sync-all)..."
            RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${API_BASE}/api/run-sync-all" \
              -H "x-sync-secret: ${SYNC_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"startDate\":\"${YEAR}-01-01\",\"endDate\":\"${YEAR}-12-31\",\"startYear\":${YEAR},\"endYear\":${YEAR}}")
          fi

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP ${HTTP_CODE}"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::API retornou HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "Sync disparado. Acompanhe em GET /api/sync/status ou na tela /admin/sync-logs. O workflow 'Keep API Acordada' mantém o Render vivo até terminar (pode levar horas)."
