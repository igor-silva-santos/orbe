name: Sync All (catálogo completo)

# ⚠️ NÃO confundir com "Invalidar Cache API" — este workflow SINCRONIZA dados (TMDB/IGDB).
# Secrets: SYNC_SECRET + ORBE_API_URL (Settings → Secrets → Actions)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação: resume = retomar checkpoint | sync_all = começar do zero'
        required: true
        default: resume
        type: choice
        options:
          - resume
          - sync_all
      start_date:
        description: Data início (só sync_all)
        required: false
        default: '2026-01-01'
      end_date:
        description: Data fim (só sync_all)
        required: false
        default: '2026-12-31'
      start_year:
        description: Ano início animes (só sync_all)
        required: false
        default: '2026'
      end_year:
        description: Ano fim animes (só sync_all)
        required: false
        default: '2026'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar API no Render (cold start)
        env:
          API_URL: ${{ secrets.ORBE_API_URL }}
        run: |
          API_BASE="${API_URL:-https://orbe-7bu0.onrender.com}"
          echo "Aguardando API em ${API_BASE}/api/health ..."
          for i in $(seq 1 12); do
            if curl -sf "${API_BASE}/api/health" >/dev/null; then
              echo "API online."
              exit 0
            fi
            echo "Tentativa ${i}/12 — aguardando 10s..."
            sleep 10
          done
          echo "::error::API não respondeu em 2 minutos."
          exit 1

      - name: Disparar sync na API
        env:
          API_URL: ${{ secrets.ORBE_API_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          API_BASE="${API_URL:-https://orbe-7bu0.onrender.com}"
          if [ -z "$SYNC_SECRET" ]; then
            echo "::error::Configure SYNC_SECRET e ORBE_API_URL em Settings → Secrets → Actions"
            exit 1
          fi

          if [ "${{ inputs.action }}" = "resume" ]; then
            echo "▶ Retomando sync do último checkpoint (run-sync-resume)..."
            RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${API_BASE}/api/run-sync-resume" \
              -H "x-sync-secret: ${SYNC_SECRET}" \
              -H "Content-Type: application/json")
          else
            echo "▶ Iniciando sync completo: ${{ inputs.start_date }} → ${{ inputs.end_date }}"
            RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${API_BASE}/api/run-sync-all" \
              -H "x-sync-secret: ${SYNC_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"startDate\":\"${{ inputs.start_date }}\",\"endDate\":\"${{ inputs.end_date }}\",\"startYear\":${{ inputs.start_year }},\"endYear\":${{ inputs.end_year }}}")
          fi

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP ${HTTP_CODE}"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::API retornou HTTP ${HTTP_CODE}"
            exit 1
          fi

      - name: Verificar se o sync iniciou
        env:
          API_URL: ${{ secrets.ORBE_API_URL }}
        run: |
          API_BASE="${API_URL:-https://orbe-7bu0.onrender.com}"
          echo "Aguardando syncActive=true (até 60s)..."
          for i in $(seq 1 12); do
            STATUS=$(curl -sf "${API_BASE}/api/sync/status" || echo '{}')
            echo "$STATUS" | python3 -m json.tool 2>/dev/null || echo "$STATUS"
            ACTIVE=$(echo "$STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('syncActive', False))" 2>/dev/null || echo False)
            if [ "$ACTIVE" = "True" ]; then
              echo "✅ Sync em andamento. Acompanhe nos logs do Render."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::syncActive ainda false após 60s. O Render free pode ter interrompido — rode novamente ou use run-sync-resume."
          exit 0
